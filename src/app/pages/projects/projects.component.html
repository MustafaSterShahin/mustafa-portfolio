<section class="projects-section">
  <div class="container">
    <div class="section-header">
      <h2>Projects</h2>
      <p class="section-subtitle">
        A collection of web applications and frontend projects I've built, featuring modern frameworks and clean architecture.
      </p>
    </div>

    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projectList" [class.featured]="project.featured">
        <div class="card-header">
          <span class="category-badge" *ngIf="project.category">{{ project.category }}</span>
          <span class="featured-badge" *ngIf="project.featured">
            <i class="fa-solid fa-star"></i> Featured
          </span>
        </div>

        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-description">{{ project.description }}</p>

        <div class="tech-tags">
          <span *ngFor="let tech of project.tech" class="tech-tag">{{ tech }}</span>
        </div>

        <div class="project-links">
          <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener noreferrer" class="link-btn github-btn">
            <i class="fa-brands fa-github"></i>
            <span>GitHub</span>
          </a>
          <a *ngIf="project.live" [href]="project.live" target="_blank" rel="noopener noreferrer" class="link-btn live-btn">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Live Demo</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
